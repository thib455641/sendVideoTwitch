<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebKore // Panneau de Modération</title>
    <!-- Inclusion de Socket.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.1/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        
        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* En-tête / Header identique à l'accueil */
        header {
            width: 100%;
            border-bottom: 2px solid #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: #000;
        }

        .header-left {
            display: flex;
            align-items: center;
            min-width: 150px;
        }


        .header-center {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            flex: 1;
        }

        .sub-nav {
            display: flex;
            gap: 20px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 150px;
            justify-content: flex-end;
            align-items: center;
        }

        .sub-nav span, .sub-nav a {
            border-bottom: 1px solid transparent;
            padding-bottom: 3px;
            color: #888;
            text-decoration: none;
        }

        .sub-nav span.active {
            border-bottom: 2px solid #fff;
            color: #fff;
        }

        .sub-nav a:hover {
            color: #fff;
        }

        /* Contenu principal de modération */
        main {
            flex: 1;
            padding: 40px;
        }

        .mod-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }

        h1 {
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .queue-counter {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid #444;
            padding: 5px 10px;
        }

        /* Grille des cartes de modération */
        .queue-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: #000;
            border: 1px solid #fff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .media-box {
            width: 100%;
            height: 180px;
            background-color: #000;
            border: 1px solid #333;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .media-box img, .media-box video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .info-box {
            margin-bottom: 20px;
        }

        .username {
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-left: 3px solid #fff;
            padding-left: 8px;
        }

        .message {
            font-size: 13px;
            color: #aaa;
            word-break: break-word;
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 10px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: 1px solid #fff;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.1s;
        }

        .btn-reject {
            background: #000;
            color: #ff4444;
            border-color: #ff4444;
        }
        .btn-reject:hover {
            background: #ff4444;
            color: #000;
        }

        .btn-accept {
            background: #fff;
            color: #000;
        }
        .btn-accept:hover {
            background: #ccc;
        }

        .empty-notice {
            text-align: center;
            color: #666;
            grid-column: 1 / -1;
            margin-top: 80px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        @media(max-width: 768px) {
            header { padding: 15px 20px; }
            .sub-nav { display: none; }
            main { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-left">
            <div class="header-frame">
            <img src="{{ url_for('static', filename='images/Sans_titre_47_20261113025440.png') }}" alt="Logo" style="max-height: 60px; width: auto;">        
            </div>
        </div>
        <div class="header-center">MODÉRATION // SYSTÈME</div>
        <div class="sub-nav">
            <span class="active">PROTOCOL_01</span>
            <span>MOD</span>
            <span>QUEUE</span>
            <a href="/logout">DÉCO</a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <div class="mod-header">
            <h1>Artefacts en attente de validation</h1>
            <div id="counter" class="queue-counter">EN ATTENTE: 0</div>
        </div>
        
        <div id="queue" class="queue-container">
            <div class="empty-notice">[ SYSTÈME STABLE ] AUCUN ARTEFACT EN ATTENTE</div>
        </div>
    </main>

    <script>
        const socket = io();
        const queueDiv = document.getElementById('queue');
        const counterDiv = document.getElementById('counter');

        // Au chargement, récupérer la file actuelle via l'API REST
        fetch('/api/queue')
            .then(res => res.json())
            .then(data => updateQueueUI(data));

        // Écouter les mises à jour en temps réel du serveur
        socket.on('update_queue', function(queue) {
            updateQueueUI(queue);
        });

        function updateQueueUI(queue) {
            counterDiv.textContent = `EN ATTENTE: ${queue.length}`;

            if (queue.length === 0) {
                queueDiv.innerHTML = '<div class="empty-notice">[ SYSTÈME STABLE ] AUCUN ARTEFACT EN ATTENTE</div>';
                return;
            }

            queueDiv.innerHTML = '';
            queue.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                let mediaHtml = item.type === 'video'
                    ? `<video src="${item.url}" controls muted autoplay loop></video>`
                    : `<img src="${item.url}" alt="Média viewer">`;

                card.innerHTML = `
                    <div class="media-box">${mediaHtml}</div>
                    <div class="info-box">
                        <div class="username">${escapeHtml(item.username)}</div>
                        <div class="message">${escapeHtml(item.message || 'Aucun message textuel joint.')}</div>
                    </div>
                    <div class="actions">
                        <button class="btn-reject" onclick="moderate('${item.id}', 'reject')">REJETER</button>
                        <button class="btn-accept" onclick="moderate('${item.id}', 'accept')">VALIDER</button>
                    </div>
                `;
                queueDiv.appendChild(card);
            });
        }

        function moderate(id, action) {
            socket.emit('moderate_action', { id: id, action: action });
        }

        // Sécurité anti-XSS
        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>

</body>
</html>
