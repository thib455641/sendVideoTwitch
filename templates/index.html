<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebKore // Transmission Média</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        
        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* En-tête / Header avec 3 sections pour un centrage parfait */
        header {
            width: 100%;
            border-bottom: 2px solid #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: #000;
        }

        .header-left {
            display: flex;
            align-items: center;
            min-width: 150px;
        }

        .header-frame {
            width: 45px;
            height: 45px;
            border: 1px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: #000;
        }

        .header-center {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            flex: 1;
        }

        .sub-nav {
            display: flex;
            gap: 20px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 150px;
            justify-content: flex-end;
        }

        .sub-nav span {
            border-bottom: 1px solid transparent;
            padding-bottom: 3px;
            color: #aaa;
        }

        .sub-nav span.active {
            border-bottom: 2px solid #fff;
            color: #fff;
        }

        /* Contenu principal centré */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .form-container {
            width: 100%;
            max-width: 550px;
            background: #000;
            padding: 20px;
        }

        h1 {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-align: center;
        }

        .manifesto {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: #ccc;
        }

        input[type="text"], textarea, input[type="file"] {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #fff;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            border-radius: 0;
        }

        input:focus, textarea:focus {
            outline: none;
            background: #111;
            border-color: #fff;
        }

        textarea {
            resize: none;
            height: 80px;
        }

        input[type="file"] {
            cursor: pointer;
        }

        .file-info {
            font-size: 10px;
            color: #888;
            margin-top: 5px;
            text-transform: uppercase;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #fff;
            color: #000;
            border: none;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: background 0.1s;
            margin-top: 10px;
        }

        button:hover {
            background: #ccc;
        }

        #status {
            margin-top: 20px;
            font-size: 12px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .success { color: #fff; }
        .error { color: #ff4444; }

        @media(max-width: 768px) {
            header { padding: 15px 20px; }
            .sub-nav { display: none; } /* Cache le menu droit sur mobile si l'écran est trop petit */
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-left">
            <img src="{{ url_for('static', filename='images/Sans_titre_47_20261113025440.png') }}" alt="Logo" style="max-height: 60px; width: auto;">        
        </div>
        <div class="header-center">TRANSMISSION // SYSTÈME</div>
        <div class="sub-nav">
            <span class="active">PROTOCOL_01</span>
            <span>INDEX</span>
            <span>FEED</span>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <div class="form-container">
            <h1>Injection de Média</h1>
            <p class="manifesto">
                Soumettez votre artefact visuel au flux principal. Toute tentative de corruption sera purgée.
            </p>

            <form id="uploadForm">
                <div class="form-group">
                    <label for="username">Identifiant / Pseudo</label>
                    <input type="text" id="username" name="username" required placeholder="ENTREZ_VOTRE_PSEUDO">
                </div>

                <div class="form-group">
                    <label for="message">Flux Textuel / Message</label>
                    <textarea id="message" name="message" placeholder="Votre message à destination du flux..."></textarea>
                </div>

                <div class="form-group">
                    <label for="file">Artefact Média (.PNG / .JPG / .GIF / .MP4)</label>
                    <input type="file" id="file" name="file" accept=".png, .jpg, .jpeg, .gif, .mp4, .webm" required>
                    <div class="file-info">[ CONTRAINTE: TAILLE MAX 5 Mo ]</div>
                </div>

                <button type="submit" id="submitBtn">EXÉCUTER L'ENVOI</button>
            </form>
            
            <div id="status"></div>
        </div>
    </main>

    <script>
        const form = document.getElementById('uploadForm');
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById('file');
            if (fileInput.files[0] && fileInput.files[0].size > 5 * 1024 * 1024) {
                statusDiv.className = 'error';
                statusDiv.textContent = '[ ERREUR ] TAILLE DU FICHIER > 5 Mo';
                return;
            }

            const formData = new FormData(form);
            submitBtn.disabled = true;
            submitBtn.textContent = 'TRANSMISSION EN COURS...';
            statusDiv.textContent = '';

            try {
                const res = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();

                if (res.ok) {
                    statusDiv.className = 'success';
                    statusDiv.textContent = '[ SUCCÈS ] ARTEFACT TRANSMIS EN MODÉRATION.';
                    form.reset();
                } else {
                    statusDiv.className = 'error';
                    statusDiv.textContent = `[ ERREUR ] ${data.error || 'ÉCHEC DE L\'ENVOI'}`;
                }
            } catch (err) {
                statusDiv.className = 'error';
                statusDiv.textContent = '[ ERREUR CRITIQUE ] PERTE DE CONNEXION AVEC LE SERVEUR.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "EXÉCUTER L'ENVOI";
            }
        });
    </script>

</body>
</html>
